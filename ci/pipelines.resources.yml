resources:
  - name: teamcitySnapshotGit
    type: GitRepo
    configuration:
      path: jfrog/teamcity-artifactory-plugin
      gitProvider: il_automation
      branches:
        include: master|dev
      buildOn:
        commit: true

  - name: teamcityReleaseGit
    type: GitRepo
    configuration:
      path: jfrog/teamcity-artifactory-plugin
      gitProvider: il_automation
      buildOn:
        commit: false

